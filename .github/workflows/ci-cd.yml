name: CI/CD Pipeline

on:
  # Déclenchement manuel depuis l'interface GitHub
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - production
          - staging
          - both
      skip_build:
        description: 'Skip Docker build (use existing images)'
        required: false
        type: boolean
        default: false
  
  # Déclenchement automatique uniquement sur les tags
  push:
    tags:
      - 'v*'
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

env:
  REGISTRY: ghcr.io
  # Convert to lowercase for GitHub Container Registry compatibility
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/tenderai-bf

jobs:
  # Build et Push des images Docker
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    # Build seulement si :
    # - Tag v* (release)
    # - Workflow manuel sans skip_build
    # - Push avec [build] dans le message de commit
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.skip_build == false) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[build]'))
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [api, frontend, worker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set lowercase owner name
        id: lowercase
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.lowercase.outputs.owner }}/tenderai-bf-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # Déploiement sur serveur (production)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: |
      always() &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (
        github.ref == 'refs/heads/main'
      )
    environment:
      name: production
      url: https://tender-ai.yulcom.net

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production server
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
          PORT: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH || '/opt/tenderai-bf' }}
          TENDERAI_JWT_SECRET: ${{ secrets.TENDERAI_JWT_SECRET }}
          TENDERAI_ADMIN_PASSWORD: ${{ secrets.TENDERAI_ADMIN_PASSWORD }}
        run: |
          ssh -p ${PORT} ${USER}@${HOST} "bash -s" << ENDSSH
            set -e
            
            DEPLOY_PATH="${DEPLOY_PATH}"
            
            # Debug: Show environment variables
            echo "🔍 DEBUG: DEPLOY_PATH = \${DEPLOY_PATH}"
            echo "🔍 DEBUG: Current user = \$(whoami)"
            echo "🔍 DEBUG: Current directory = \$(pwd)"
            
            # Debug: Check if directory exists
            if [ -d "\${DEPLOY_PATH}" ]; then
              echo "✅ Directory \${DEPLOY_PATH} exists"
            else
              echo "❌ Directory \${DEPLOY_PATH} does NOT exist"
              exit 1
            fi
            
            # Change to deploy directory
            cd \${DEPLOY_PATH}
            echo "🔍 DEBUG: Changed to \$(pwd)"
            
            # Debug: Check git status
            if [ -d ".git" ]; then
              echo "✅ Git repository found"
              git status
            else
              echo "❌ Not a git repository"
              exit 1
            fi
            
            # Pull latest code
            echo "📥 Pulling latest code..."
            git pull origin main
            
            # Debug: Verify alembic.ini has correct format
            echo "🔍 DEBUG: Checking alembic.ini..."
            grep "version_num_format" alembic.ini || echo "version_num_format not found"
            grep "format.*levelname" alembic.ini || echo "format line not found"
            
            # Setup production environment - comment out port mappings in .env
            echo "📝 Configuring production environment..."
            # Copy production override (no port exposures)
            cp docker-compose.override.prod.yml docker-compose.override.yml
            
            if [ -f ".env" ]; then
              # Comment out port mappings to prevent exposure
              sed -i 's/^POSTGRES_PORT=/#POSTGRES_PORT=/' .env
              sed -i 's/^MINIO_PORT=/#MINIO_PORT=/' .env
              sed -i 's/^MINIO_CONSOLE_PORT=/#MINIO_CONSOLE_PORT=/' .env
              sed -i 's/^API_PORT=/#API_PORT=/' .env
              sed -i 's/^UI_PORT=/#UI_PORT=/' .env
              # Fix cron expressions
              sed -i 's/^CRON_SCHEDULE=\([^"]\)/CRON_SCHEDULE="\1/' .env
              sed -i 's/^\(CRON_SCHEDULE="[^"]*\)$/\1"/' .env
              sed -i 's/^BACKUP_SCHEDULE=\([^"]\)/BACKUP_SCHEDULE="\1/' .env
              sed -i 's/^\(BACKUP_SCHEDULE="[^"]*\)$/\1"/' .env
              # Inject security credentials from GitHub Secrets
              sed -i "s|^TENDERAI_JWT_SECRET=.*|TENDERAI_JWT_SECRET=${TENDERAI_JWT_SECRET}|" .env
              sed -i "s|^TENDERAI_ADMIN_PASSWORD=.*|TENDERAI_ADMIN_PASSWORD=${TENDERAI_ADMIN_PASSWORD}|" .env
            fi
            
            # Login to GitHub Container Registry
            echo "🔐 Logging in to registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Set environment to production
            export ENVIRONMENT=production
            
            # Stop all services first (--remove-orphans stops renamed/deleted services like old tenderai-ui)
            echo "🛑 Stopping existing services..."
            docker compose down --remove-orphans || true
            
            # Ensure logs directory has correct permissions
            echo "🔧 Setting up logs directory..."
            if [ -d "logs" ] && [ ! -w "logs" ]; then
              echo "⚠️  WARNING: logs directory exists but is not writable"
              echo "Run on server: sudo chown -R \$(whoami):\$(whoami) \${DEPLOY_PATH}/logs"
              echo "Attempting to continue anyway..."
            fi
            mkdir -p logs/nodes 2>/dev/null || true
            chmod -R 777 logs 2>/dev/null || true
            
            # Pull latest images (use pre-built images from registry)
            echo "🐳 Pulling Docker images..."
            docker compose pull api frontend worker || true
            
            # Verify the api image is available (abort if never built)
            if ! docker image inspect ghcr.io/abdazz/tenderai-bf-api:latest > /dev/null 2>&1; then
              echo "❌ API image not found locally or in registry."
              echo "   Trigger a build first: push a commit with '[build]' in the message,"
              echo "   push a 'v*' tag, or run the workflow manually with skip_build=false."
              exit 1
            fi
            echo "✅ API image available: \$(docker image inspect ghcr.io/abdazz/tenderai-bf-api:latest --format '{{.Id}}' | cut -c1-19)"
            if ! docker image inspect ghcr.io/abdazz/tenderai-bf-frontend:latest > /dev/null 2>&1; then
              echo "❌ Frontend image not found. Run workflow manually with skip_build=false."
              exit 1
            fi
            
            # Ensure logs directory exists (ignore if already exists or no permissions)
            echo "📁 Setting up logs directory..."
            mkdir -p logs/nodes 2>/dev/null || true
            
            # Start dependencies first (PostgreSQL, MinIO)
            echo "🗄️ Starting dependencies..."
            docker compose up -d postgres minio createbuckets
            
            # Wait for PostgreSQL to be ready
            echo "⏳ Waiting for database to be ready..."
            until docker compose exec -T postgres pg_isready -U \${POSTGRES_USER:-tenderai} -d \${POSTGRES_DB:-tenderai_bf} </dev/null; do
              echo "  Waiting for postgres..."
              sleep 3
            done
            echo "✅ Database is ready"

            # Wait for MinIO to be ready (healthcheck interval is 30s; must be up before migrations)
            echo "⏳ Waiting for MinIO to be ready..."
            for minio_attempt in \$(seq 1 20); do
              if docker compose exec -T minio curl -sf http://localhost:9000/minio/health/live </dev/null > /dev/null 2>&1; then
                echo "✅ MinIO is ready (attempt \${minio_attempt})"
                break
              fi
              if [ \${minio_attempt} -eq 20 ]; then
                echo "❌ MinIO did not become ready in time"
                docker compose logs --tail=30 minio
                exit 1
              fi
              echo "  Waiting for minio (attempt \${minio_attempt})..."
              sleep 5
            done

            # Run database migrations before starting application services
            # --no-deps: we waited for dependencies manually above, skip docker-compose's health waits
            echo "🔄 Running database migrations..."
            docker compose run --no-deps --rm api alembic upgrade head </dev/null || {
              echo "❌ Migration failed"
              echo "--- postgres logs ---"
              docker compose logs --tail=30 postgres
              echo "--- api container logs ---"
              docker compose logs --tail=30 api
              exit 1
            }
            echo "✅ Migrations applied"

            # Ensure the admin user exists (idempotent: skips if already present)
            echo "👤 Ensuring admin user exists..."
            docker compose run --no-deps --rm api tenderai create-admin </dev/null && \
              echo "✅ Admin user ready" || \
              echo "⚠️  create-admin exited non-zero (check TENDERAI_ADMIN_PASSWORD is set)"

            # Start only app services — postgres and minio are already running and healthy;
            # running "up -d --remove-orphans" over the whole project can recreate them
            # (config hash change) which resets their health state and blocks the api.
            echo "🚀 Starting application services..."
            docker compose up -d api frontend worker nginx

            # Immediate status after start
            echo "📊 Container status (t+0):"
            docker compose ps
            echo "📋 API logs immediately after start:"
            docker compose logs --tail=30 api

            # Wait for API to be healthy before declaring success (up to 3 minutes)
            echo "⏳ Waiting for API to become healthy..."
            for i in \$(seq 1 18); do
              echo "  [attempt \$i/18] docker compose ps api:"
              docker compose ps api
              if docker compose exec -T api curl -sf http://localhost:8000/health </dev/null > /dev/null 2>&1; then
                echo "✅ API is healthy on attempt \$i"
                break
              fi
              if [ \$i -eq 18 ]; then
                echo "❌ API did not become healthy after 3 minutes — full logs:"
                docker compose logs --tail=100 api
                docker compose logs --tail=30 postgres
                docker compose logs --tail=30 minio
                exit 1
              fi
              echo "  Attempt \$i: API not ready, waiting 10s..."
              sleep 10
            done
            
            # Clean up old images
            echo "🧹 Cleaning up..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully"
          ENDSSH

      - name: Health check
        env:
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          SSH_USER: ${{ secrets.PRODUCTION_USER }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH || '/opt/tenderai-bf' }}
        run: |
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            DEPLOY_PATH="${DEPLOY_PATH}" \
            'bash -s' << 'HEALTHEOF'
            cd "${DEPLOY_PATH}"
            echo '=== Final container status ==='
            docker compose ps
            for i in $(seq 1 6); do
              if docker compose exec -T api curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ API OK (attempt $i)"
                exit 0
              fi
              if [ $i -eq 6 ]; then
                echo "❌ API down after $((i * 10))s — last logs:"
                docker compose logs --tail=50 api
                exit 1
              fi
              echo "  Attempt $i: API not ready, waiting 10s..."
              sleep 10
            done
          HEALTHEOF

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Production deployment successful"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Production deployment failed"

  # Déploiement sur serveur (staging)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: |
      always() &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (
        github.ref == 'refs/heads/develop' ||
        (github.event_name == 'workflow_dispatch' && (inputs.environment == 'staging' || inputs.environment == 'both'))
      )
    environment:
      name: staging
      url: https://staging.tender-ai.yulcom.net

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to staging server
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          PORT: ${{ secrets.STAGING_SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH || '/opt/tenderai-bf-staging' }}
          TENDERAI_JWT_SECRET: ${{ secrets.TENDERAI_JWT_SECRET }}
          TENDERAI_ADMIN_PASSWORD: ${{ secrets.TENDERAI_ADMIN_PASSWORD }}
        run: |
          ssh -p ${PORT} ${USER}@${HOST} "bash -s" << ENDSSH
            set -e
            
            DEPLOY_PATH="${DEPLOY_PATH}"
            
            cd \${DEPLOY_PATH}
            
            # Pull latest code
            git pull origin develop
            
            # Copy production override file (no port exposures)
            cp docker-compose.override.prod.yml docker-compose.override.yml
            
            # Setup staging environment
            if [ -f ".env" ]; then
              sed -i 's/^POSTGRES_PORT=/#POSTGRES_PORT=/' .env
              sed -i 's/^MINIO_PORT=/#MINIO_PORT=/' .env
              sed -i 's/^MINIO_CONSOLE_PORT=/#MINIO_CONSOLE_PORT=/' .env
              sed -i 's/^API_PORT=/#API_PORT=/' .env
              sed -i 's/^UI_PORT=/#UI_PORT=/' .env
              # Inject security credentials from GitHub Secrets
              sed -i "s|^TENDERAI_JWT_SECRET=.*|TENDERAI_JWT_SECRET=${TENDERAI_JWT_SECRET}|" .env
              sed -i "s|^TENDERAI_ADMIN_PASSWORD=.*|TENDERAI_ADMIN_PASSWORD=${TENDERAI_ADMIN_PASSWORD}|" .env
            fi
            
            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Set environment to staging
            export ENVIRONMENT=staging
            
            # Stop all services (--remove-orphans cleans up renamed/deleted services)
            docker compose down --remove-orphans || true

            # Pull latest images (use pre-built images from registry)
            docker compose pull api frontend worker || true

            # Start dependencies first (PostgreSQL, MinIO)
            docker compose up -d postgres minio createbuckets

            # Wait for PostgreSQL to be ready
            until docker compose exec -T postgres pg_isready -U \${POSTGRES_USER:-tenderai} -d \${POSTGRES_DB:-tenderai_bf} </dev/null; do
              sleep 3
            done

            # Wait for MinIO to be ready
            for minio_attempt in \$(seq 1 20); do
              if docker compose exec -T minio curl -sf http://localhost:9000/minio/health/live </dev/null > /dev/null 2>&1; then
                break
              fi
              [ \${minio_attempt} -eq 20 ] && { docker compose logs --tail=30 minio; exit 1; }
              sleep 5
            done

            # Run database migrations before starting application services
            docker compose run --no-deps --rm api alembic upgrade head </dev/null || {
              echo "Migration failed, checking postgres logs..."
              docker compose logs --tail=50 postgres
              exit 1
            }
            
            # Start all services
            docker compose up -d
            
            # Clean up old images
            docker image prune -f
            
            echo "Staging deployment completed successfully"
          ENDSSH

      - name: Health check
        run: |
          sleep 30
          curl -f https://staging.tender-ai.yulcom.net/health || exit 1

  # Scan de sécurité
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-and-push]
    # Only run if build actually executed (not skipped)
    if: |
      needs.build-and-push.result == 'success' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set lowercase owner name
        id: lowercase
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ steps.lowercase.outputs.owner }}/tenderai-bf-api:latest
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
